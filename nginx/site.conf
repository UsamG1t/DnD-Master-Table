# Внутренний nginx приложения: только HTTP. TLS, домены и ACME — на edge-прокси.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/... -> backend без префикса (роутеры FastAPI: /auth, /dnd, /games...).
    # rewrite + переменная в proxy_pass: адрес backend резолвится в рантайме,
    # поэтому перезапуск контейнера не ломает upstream.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $dnd_backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $dnd_backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
